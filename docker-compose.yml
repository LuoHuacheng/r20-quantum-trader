# ==============================================================================
# R20 Quantum Trader - Production Docker Compose Stack
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Web 主引擎：FastAPI 控制面 + Vue 3 操盘大屏与管理后台
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: r20-quantum-trader:latest
    container_name: r20-backend
    restart: unless-stopped
    command: ["backend"]
    ports:
      - "8080:8080"
    # 容器内访问宿主机上的本地 LLM 供应商（如 127.0.0.1:3123）：
    # 容器里的 127.0.0.1 是容器自身，必须经 host.docker.internal 出网。
    # Linux 需 host-gateway；macOS/Windows Docker Desktop 自带解析。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - R20_STANDALONE_GATEWAY=true
    volumes:
      # 挂载私密配置（读写挂载：支持管理后台直接修改并持久化配置变更）
      - ./.env:/app/.env
      # 挂载持久化运行态数据
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
      # 物理风控插件（读写挂载）：管理后台的插件代码编辑/新建/删除会直接写这些文件。
      # 不挂载则容器内 /app/plugins 不存在 ⇒ 启用的插件一律被判「文件缺失」⇒
      # interceptor_manager 对**每一笔**非 WAIT 信号 fail-closed 降级为 WAIT
      # （实盘表现为「连续多轮空仓」）。
      - ./plugins:/app/plugins
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 2. 量化网关与调度核心：15分钟波段扫描、因子刷新、AI 投委会与硬风控执行
  # ----------------------------------------------------------------------------
  gateway:
    image: r20-quantum-trader:latest
    container_name: r20-gateway
    restart: unless-stopped
    command: ["gateway"]
    # 调度器独立成容器后，LLM 调用路径随之一并搬到这里 ——
    # backend 那份 extra_hosts 覆盖不到本容器，必须各自声明。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
      # 与 backend 同源：调度器所在容器也要能读插件（风控闸在同一进程链上）
      - ./plugins:/app/plugins
    depends_on:
      backend:
        condition: service_healthy
